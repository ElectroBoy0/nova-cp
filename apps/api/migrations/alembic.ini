# Alembic configuration file.
# This file is used by Alembic for database migration management.
# The actual connection URL is injected at runtime from app.config.

[alembic]
# script_location is resolved relative to CWD when Alembic is invoked.
# Run from apps/api/ with:  uv run alembic -c migrations/alembic.ini upgrade head
# Then 'migrations' resolves to apps/api/migrations/ which contains env.py.
script_location = migrations

# Template for new migration files
file_template = %%(year)d%%(month)02d%%(day)02d_%%(hour)02d%%(minute)02d_%%(rev)s_%%(slug)s

# Timezone for generated migration timestamps
timezone = UTC

# Max length of characters to apply to the slug field
truncate_slug_length = 40

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
